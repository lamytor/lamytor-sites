<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07040f">
<title>Lamytor – Tous mes liens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07040f; --ink:#f3ecff; --muted:#b9a7e6; --glow:#a855f7; --glow2:#6d28d9; --accent:#d8b4fe;
  --panel:rgba(30,16,60,.55); --panel-ink:#f3ecff; --line:rgba(168,85,247,.45);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{
  margin:0; color:var(--ink); min-height:100vh; display:flex; justify-content:center;
  font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
  background:
    radial-gradient(ellipse 70% 45% at 85% 5%, rgba(168,85,247,.35), transparent 70%),
    radial-gradient(ellipse 60% 50% at 5% 60%, rgba(79,70,229,.30), transparent 70%),
    radial-gradient(ellipse 70% 40% at 70% 100%, rgba(192,38,211,.25), transparent 70%),
    var(--bg);
  background-attachment:fixed;
}
/* étoiles */
body::before,body::after{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
  background-repeat:repeat;
}
body::before{
  background-image:
    radial-gradient(1.5px 1.5px at 20px 30px,#fff,transparent),
    radial-gradient(1px 1px at 90px 120px,#e9d5ff,transparent),
    radial-gradient(1.5px 1.5px at 160px 60px,#fff,transparent),
    radial-gradient(1px 1px at 230px 180px,#c4b5fd,transparent),
    radial-gradient(1px 1px at 60px 200px,#fff,transparent);
  background-size:260px 240px; opacity:.8;
}
body::after{
  background-image:
    radial-gradient(2px 2px at 40px 80px,#fff,transparent),
    radial-gradient(1px 1px at 140px 20px,#f5d0fe,transparent),
    radial-gradient(1.5px 1.5px at 200px 150px,#fff,transparent);
  background-size:380px 330px; opacity:.6; animation:twinkle 5s ease-in-out infinite alternate;
}
@keyframes twinkle{from{opacity:.25}to{opacity:.8}}
main{position:relative; z-index:1; width:100%; max-width:560px; padding:28px 20px 40px}
.avatar{
  width:96px; height:96px; border-radius:50%; margin-bottom:20px;
  background:radial-gradient(circle at 30% 30%, #e9d5ff, #a855f7 45%, #4c1d95);
  color:#fff; display:grid; place-items:center; font-weight:800; font-size:48px;
  box-shadow:0 0 40px rgba(168,85,247,.7), 0 0 90px rgba(109,40,217,.5);
}
.collage{display:block; width:calc(100% + 40px); max-width:none; margin:-28px -20px 6px; height:auto; filter:drop-shadow(0 0 30px rgba(168,85,247,.35))}
h1{
  font-size:clamp(56px,16vw,92px); line-height:.9; margin:0 0 14px;
  font-weight:800; letter-spacing:-.04em;
  background:linear-gradient(180deg,#fff 30%,#c4a1ff 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  text-shadow:none; filter:drop-shadow(0 0 22px rgba(168,85,247,.55));
}
.bio{font-size:18px; line-height:1.45; color:var(--muted); margin:0 0 36px; max-width:34ch}
ul{list-style:none; margin:0; padding:0; display:grid; gap:12px}
a.link{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  background:var(--panel); color:var(--panel-ink); text-decoration:none;
  border:1px solid var(--line); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  padding:18px 22px; border-radius:18px; font-weight:600; font-size:20px;
  transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
}
a.link small{display:block; font-weight:400; font-size:14px; color:var(--muted); margin-top:2px}
a.link .go{font-size:22px; font-weight:800; color:var(--accent)}
a.link:hover{transform:translateY(-3px); border-color:var(--accent); box-shadow:0 0 28px rgba(168,85,247,.55)}
a.link:focus-visible{outline:3px solid var(--accent); outline-offset:3px}
a.main{background:linear-gradient(135deg,#7c3aed,#c026d3); border-color:transparent; box-shadow:0 0 30px rgba(168,85,247,.45)}
a.main small,a.main .go{color:#f5e9ff}
footer{margin-top:40px; font-size:14px; color:var(--muted)}
@media (prefers-reduced-motion:reduce){a.link{transition:none}a.link:hover{transform:none}body::after{animation:none}}

#galaxy{position:fixed; inset:0; width:100%; height:100%; z-index:0; display:block; pointer-events:none}
body.gl::before,body.gl::after{display:none}
#music{
  position:fixed; z-index:5; top:calc(env(safe-area-inset-top,0px) + 14px); right:14px;
  display:flex; align-items:center; gap:8px; cursor:pointer;
  font:600 15px "Bricolage Grotesque",system-ui,sans-serif; color:var(--ink);
  background:var(--panel); border:1px solid var(--line); border-radius:999px; padding:10px 16px;
  backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  transition:box-shadow .2s ease, border-color .2s ease;
}
#music:hover{border-color:var(--accent); box-shadow:0 0 22px rgba(168,85,247,.55)}
#music:focus-visible{outline:3px solid var(--accent); outline-offset:3px}
#music .eq{display:inline-flex; gap:2px; align-items:flex-end; height:14px}
#music .eq i{display:block; width:3px; height:4px; background:var(--accent); border-radius:2px}
#music[aria-pressed="true"] .eq i{animation:eq 1.1s ease-in-out infinite}
#music[aria-pressed="true"] .eq i:nth-child(2){animation-delay:.25s}
#music[aria-pressed="true"] .eq i:nth-child(3){animation-delay:.5s}
@keyframes eq{0%,100%{height:4px}50%{height:14px}}
#music:not([aria-pressed="true"]){animation:hint 2.4s ease-in-out infinite}
@keyframes hint{0%,100%{box-shadow:0 0 0 rgba(168,85,247,0)}50%{box-shadow:0 0 22px rgba(168,85,247,.6)}}
@media (prefers-reduced-motion:reduce){#music .eq i,#music:not([aria-pressed="true"]){animation:none!important}}

.viewer{width:calc(100% + 40px); margin:-20px -20px 8px; outline:none}
.stage{position:relative; width:100%; aspect-ratio:1/.92; cursor:grab; touch-action:pan-y; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; overflow:hidden}
.stage.drag{cursor:grabbing}
.stage .pose{position:absolute; left:0; top:0; height:auto; transform-origin:50% 91%; pointer-events:none; -webkit-user-drag:none; will-change:transform,opacity}
.floor{position:absolute; border-radius:50%; border:2px solid rgba(190,120,255,.75); box-shadow:0 0 26px rgba(168,85,247,.55), inset 0 0 26px rgba(168,85,247,.35); pointer-events:none}
.floor.f2{border:2px dashed rgba(216,180,254,.45); box-shadow:none}
.pname{text-align:center; margin:2px 20px 0; font-weight:800; font-size:clamp(24px,6.4vw,34px); letter-spacing:-.02em; color:var(--ink); text-shadow:0 0 22px rgba(168,85,247,.8); min-height:1.3em; transition:opacity .18s ease}
.pname.swap{opacity:0}
.dots{display:flex; justify-content:center; gap:8px; margin:10px 0 0}
.dots i{display:block; width:8px; height:8px; border-radius:50%; background:var(--muted); opacity:.35; transition:opacity .15s, transform .15s}
.dots i.on{opacity:1; background:var(--accent); transform:scale(1.35)}
.vhint{margin:10px 20px 0; text-align:center; font-size:14px; color:var(--muted); transition:opacity .4s}
.vhint.gone{opacity:0}
.viewer:focus-visible .stage{outline:3px solid var(--accent); outline-offset:-3px; border-radius:18px}

a.link .lt{display:flex; align-items:center; gap:14px; min-width:0}
a.link .ico{flex:none; width:44px; height:44px; border-radius:12px; display:grid; place-items:center; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.12)}
a.link .ico svg{width:26px; height:26px; display:block}
a.main .ico{background:rgba(255,255,255,.18); border-color:rgba(255,255,255,.28)}

/* ================= Animations & finitions ================= */
@keyframes rise{from{opacity:0;transform:translateY(28px) scale(.97)}to{opacity:1;transform:none}}
@keyframes shimmer{0%{background-position:150% 0}100%{background-position:-150% 0}}
@keyframes glowp{0%,100%{filter:drop-shadow(0 0 16px rgba(168,85,247,.45))}50%{filter:drop-shadow(0 0 34px rgba(190,110,255,.95))}}
@keyframes floorp{0%,100%{box-shadow:0 0 22px rgba(168,85,247,.45), inset 0 0 22px rgba(168,85,247,.3)}50%{box-shadow:0 0 44px rgba(168,85,247,.9), inset 0 0 34px rgba(168,85,247,.55)}}
@keyframes dash{to{stroke-dashoffset:-160}}
@keyframes mainpulse{0%,100%{box-shadow:0 0 26px rgba(168,85,247,.4)}50%{box-shadow:0 0 50px rgba(217,70,239,.75)}}
@keyframes rip{to{transform:scale(1);opacity:0}}
@keyframes blink{50%{opacity:0}}
@keyframes shoot{0%{transform:translate(0,0) rotate(28deg);opacity:0}12%{opacity:1}100%{transform:translate(540px,287px) rotate(28deg);opacity:0}}

#music{animation:rise .8s cubic-bezier(.2,.8,.2,1) .2s both}
.viewer{animation:rise 1s cubic-bezier(.2,.8,.2,1) .15s both}
h1{
  background:linear-gradient(100deg,#fff 18%,#e9d5ff 34%,#c084fc 48%,#f0abfc 52%,#e9d5ff 66%,#fff 82%);
  background-size:260% 100%; -webkit-background-clip:text; background-clip:text; color:transparent;
  animation:rise .9s cubic-bezier(.2,.8,.2,1) .45s both, shimmer 7s linear 1.4s infinite, glowp 4.5s ease-in-out infinite;
}
.bio{min-height:calc(1.45em*2); animation:rise .8s cubic-bezier(.2,.8,.2,1) .6s both}
.caret{display:inline-block; width:2px; height:1.05em; background:var(--accent); margin-left:3px; vertical-align:-2px; animation:blink .8s steps(1) infinite}
ul#links li{animation:rise .7s cubic-bezier(.2,.8,.2,1) both; animation-delay:calc(.85s + var(--i,0)*.12s)}
footer{animation:rise .8s ease 1.6s both}

a.link{
  --b:168,85,247; position:relative; overflow:hidden; -webkit-tap-highlight-color:transparent;
  transform:perspective(700px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(var(--ty,0px));
  transition:transform .18s ease, box-shadow .25s ease, border-color .25s ease, background .25s ease;
}
a.link::before{
  content:""; position:absolute; inset:0; pointer-events:none;
  background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.2) 50%,transparent 70%);
  transform:translateX(-130%); transition:transform .75s ease;
}
a.link:hover{
  transform:perspective(700px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(-3px);
  border-color:rgba(var(--b),.95); box-shadow:0 0 36px rgba(var(--b),.55), inset 0 0 24px rgba(var(--b),.16);
}
a.link:hover::before{transform:translateX(130%)}
a.link:active{transform:perspective(700px) translateY(0) scale(.98)}
a.link .go{transition:transform .22s ease}
a.link:hover .go{transform:translateX(7px)}
a.link .ico{transition:transform .3s cubic-bezier(.3,1.7,.5,1), box-shadow .3s ease}
a.link:hover .ico{transform:translateY(-2px) rotate(-7deg) scale(1.1); box-shadow:0 0 18px rgba(var(--b),.7)}
a.main{animation:mainpulse 3.2s ease-in-out infinite}
.rip{position:absolute; border-radius:50%; background:radial-gradient(circle,rgba(var(--b),.55),transparent 65%); transform:scale(0); animation:rip .65s ease-out forwards; pointer-events:none}

.floor{animation:floorp 4.2s ease-in-out infinite}
.floor.f2{display:none}
.orbit{position:absolute; inset:0; width:100%; height:100%; pointer-events:none; overflow:visible}
#orb1{animation:dash 9s linear infinite}
.comet{filter:drop-shadow(0 0 7px #d8b4fe) drop-shadow(0 0 14px #a855f7)}
.pname{transition:opacity .18s ease, transform .18s ease}
.pname.swap{transform:translateY(8px)}

#fx{position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none}
.shoot{position:absolute; width:150px; height:2px; border-radius:2px; background:linear-gradient(90deg,rgba(255,255,255,0),#fff); filter:drop-shadow(0 0 6px #c4b5fd); animation:shoot 1.25s ease-out forwards}
#cglow{position:fixed; left:0; top:0; width:440px; height:440px; margin:-220px 0 0 -220px; border-radius:50%; pointer-events:none; z-index:0;
  background:radial-gradient(circle,rgba(168,85,247,.2),rgba(168,85,247,.07) 40%,transparent 68%); mix-blend-mode:screen; will-change:transform}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important; transition:none!important}}
</style>
</head>

  function hz(m){return 440*Math.pow(2,(m-69)/12);}
  function reverb(c){var L=Math.floor(c.sampleRate*5),buf=c.createBuffer(2,L,c.sampleRate);
    for(var ch=0;ch<2;ch++){var d=buf.getChannelData(ch);for(var i=0;i<L;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/L,2.8);}
    var cv=c.createConvolver();cv.buffer=buf;return cv;}
  function init(){
    var AC=window.AudioContext||window.webkitAudioContext; if(!AC) return false;
    ctx=new AC(); master=ctx.createGain(); master.gain.value=0;
    var comp=ctx.createDynamicsCompressor(); master.connect(comp); comp.connect(ctx.destination);
    bus=ctx.createGain(); bus.gain.value=1;
    var dry=ctx.createGain(); dry.gain.value=.55; bus.connect(dry); dry.connect(master);
    var rv=reverb(ctx),wet=ctx.createGain(); wet.gain.value=.8; bus.connect(rv); rv.connect(wet); wet.connect(master);
    var dl=ctx.createDelay(1.5); dl.delayTime.value=.56; var fb=ctx.createGain(); fb.gain.value=.38;
    var dlp=ctx.createBiquadFilter(); dlp.type='lowpass'; dlp.frequency.value=2600;
    dl.connect(dlp); dlp.connect(fb); fb.connect(dl); dlp.connect(rv);
    bus.delayIn=dl; return true;
  }
  function pad(c,t,len){
    var lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.Q.value=.4;
    lp.frequency.setValueAtTime(500,t); lp.frequency.linearRampToValueAtTime(1300,t+len*.55); lp.frequency.linearRampToValueAtTime(600,t+len+2);
    var g=ctx.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.075,t+2.8); g.gain.setValueAtTime(.075,t+len-.5); g.gain.linearRampToValueAtTime(0,t+len+3.2);
    lp.connect(g); g.connect(bus);
    c.n.forEach(function(m,i){
      [['triangle',-6],['sine',7]].forEach(function(o){
        var os=ctx.createOscillator(); os.type=o[0]; os.frequency.value=hz(m); os.detune.value=o[1]+(i-2)*1.5;
        os.connect(lp); os.start(t); os.stop(t+len+3.4);
      });
    });
    var bo=ctx.createOscillator(); bo.type='sine'; bo.frequency.value=hz(c.b);
    var bg=ctx.createGain(); bg.gain.setValueAtTime(0,t); bg.gain.linearRampToValueAtTime(.17,t+2); bg.gain.linearRampToValueAtTime(0,t+len+2.5);
    bo.connect(bg); bg.connect(bus); bo.start(t); bo.stop(t+len+2.8);
  }
  function bell(t,m,vel){
    var o=ctx.createOscillator(),o2=ctx.createOscillator(),g=ctx.createGain();
    o.type='sine'; o.frequency.value=hz(m); o2.type='sine'; o2.frequency.value=hz(m)*2.003;
    var g2=ctx.createGain(); g2.gain.value=.22; o2.connect(g2); g2.connect(g);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vel,t+.012); g.gain.exponentialRampToValueAtTime(.0008,t+3.2);
    o.connect(g); g.connect(bus); if(bus.delayIn) g.connect(bus.delayIn);
    o.start(t); o2.start(t); o.stop(t+3.4); o2.stop(t+3.4);
  }
  function chord(t){
    var c=CH[idx%CH.length], len=9; idx++;
    pad(c,t,len);
    var k=0, bt=t+1.2;
    while(bt<t+len-.5){
      if(Math.random()<.7){ bell(bt,BELL[Math.floor(Math.random()*BELL.length)],.05+Math.random()*.035); k++; }
      bt+=.9+Math.random()*1.5;
    }
    return len;
  }
  function tick(){
    while(nextT<ctx.currentTime+5){ nextT+=chord(nextT)-1.5; }
  }
  function set(state){
    on=state; btn.setAttribute('aria-pressed',on?'true':'false');
    btn.setAttribute('aria-label',on?'Couper la musique':'Activer la musique');
    lab.textContent=on?'Musique : on':'Musique';
  }
  var waiting=false;
  var GEST=['pointerdown','pointerup','mousedown','touchend','click','keydown'];
  function unhook(){ GEST.forEach(function(e){document.removeEventListener(e,onGesture,true);}); waiting=false; }
  function onGesture(ev){
    if(btn.contains(ev.target)) return;
    if(on && ctx){ ctx.resume(); }
    unhook();
  }
  function startMusic(){
    if(!ctx && !init()) return;
    ctx.resume();
    if(!timer){ nextT=ctx.currentTime+.2; tick(); timer=setInterval(tick,1000); }
    master.gain.cancelScheduledValues(ctx.currentTime);
    master.gain.setValueAtTime(master.gain.value,ctx.currentTime);
    master.gain.linearRampToValueAtTime(.15,ctx.currentTime+3);
    set(true);
    if(ctx.state!=='running' && !waiting){ waiting=true; GEST.forEach(function(e){document.addEventListener(e,onGesture,true);}); }
  }
  function stopMusic(){
    unhook(); set(false);
    if(!ctx) return;
    master.gain.cancelScheduledValues(ctx.currentTime);
    master.gain.setValueAtTime(master.gain.value,ctx.currentTime);
    master.gain.linearRampToValueAtTime(0,ctx.currentTime+1.2);
    setTimeout(function(){ if(!on&&ctx){ clearInterval(timer); timer=null; ctx.suspend(); } },1500);
  }
  btn.addEventListener('click',function(){
    if(on && ctx && ctx.state!=='running'){ ctx.resume(); unhook(); return; }  /* 1er clic = lance le son bloque par le navigateur */
    if(on) stopMusic(); else startMusic();
  });
  /* musique allumee des l'arrivee (le son demarre au 1er geste si le navigateur le bloque) */
  startMusic();
})();
</script>

<script>
/* ===== Cercle de poses : maintiens et fais tourner ===== */
(function(){
  var stage=document.getElementById('stage'),view=document.getElementById('viewer'),
      items=[].slice.call(stage.querySelectorAll('.pose')),dotsEl=document.getElementById('dots'),
      nm=document.getElementById('pname'),hint=document.getElementById('vhint'),
      fl=document.getElementById('floor'),fl2=document.getElementById('floor2');
  var N=items.length; if(!N) return;
  var STEP=360/N, rot=0, target=0, vel=0, down=false, sx=0, lx=0, lt=0, moved=false, raf=0, cur=-1;
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  items.forEach(function(){var d=document.createElement('i');dotsEl.appendChild(d);});
  var dl=[].slice.call(dotsEl.children);
  var W=0,H=0,IW=0,IH=0,RX=0,RY=0,GY=0,CX=0, T=0,PX=0,tPX=0,sway=0,lastI=performance.now();
  function layout(){
    W=stage.clientWidth; H=stage.clientHeight;
    IW=W*.54; IH=IW*820/720; RX=W*.37; RY=W*.12; CX=W/2; GY=H*.80;
    items.forEach(function(el){el.style.width=IW+'px';});
    fl.style.width=(RX*2)+'px'; fl.style.height=RY+'px'; fl.style.left=(CX-RX)+'px'; fl.style.top=(GY-RY)+'px';
    fl2.style.width=(RX*2*1.16)+'px'; fl2.style.height=(RY*1.2)+'px'; fl2.style.left=(CX-RX*1.16)+'px'; fl2.style.top=(GY-RY*1.1)+'px';
    var ob=document.getElementById('orbit'), e1=document.getElementById('orb1'), op_=document.getElementById('orbp');
    if(ob&&e1&&op_){
      var ex=RX*1.16, ey=RY*.6, ecx=CX, ecy=GY-RY*.5;
      ob.setAttribute('viewBox','0 0 '+W+' '+H);
      e1.setAttribute('cx',ecx); e1.setAttribute('cy',ecy); e1.setAttribute('rx',ex); e1.setAttribute('ry',ey);
      op_.setAttribute('d','M'+(ecx-ex)+','+ecy+' a'+ex+','+ey+' 0 1,0 '+(2*ex)+',0 a'+ex+','+ey+' 0 1,0 '+(-2*ex)+',0');
    }
    draw();
  }
  function norm(a){a%=360; if(a<0)a+=360; return a;}
  function draw(){
    var best=0,bd=-2;
    for(var i=0;i<N;i++){
      var a=(i*STEP+rot+sway)*Math.PI/180, dp=Math.cos(a), t=(dp+1)/2, x=Math.sin(a)*RX+PX*10*t;
      var s=.52+.48*t, y=GY-RY*(1-dp)/2+Math.sin(T/650+i*1.3)*4*(.4+.6*t);
      var el=items[i];
      el.style.transform='translate('+(CX+x-IW/2)+'px,'+(y-IH*.91)+'px) scale('+s.toFixed(4)+')';
      var zi=Math.round(dp*100)+100, op=(.28+.72*Math.pow(t,1.3)).toFixed(2), fi='brightness('+(.5+.5*t).toFixed(2)+')';
      if(el._z!==zi){el.style.zIndex=zi;el._z=zi;}
      if(el._o!==op){el.style.opacity=op;el._o=op;}
      if(el._f!==fi){el.style.filter=fi;el._f=fi;}
      var db=Math.cos((i*STEP+rot)*Math.PI/180);
      if(db>bd){bd=db;best=i;}
    }
    if(best!==cur){
      cur=best; dl.forEach(function(d,k){d.classList.toggle('on',k===cur);});
      nm.classList.add('swap');
      setTimeout(function(){nm.textContent=items[cur].getAttribute('data-label');nm.classList.remove('swap');},reduce?0:120);
    }
  }
  function nearestTarget(r){return Math.round(r/STEP)*STEP;}
  function tick(){
    if(down){raf=0;return;}
    if(Math.abs(vel)>.05){ rot+=vel; vel*=.93; target=nearestTarget(rot+vel*12); }
    else { rot+=(target-rot)*.14; }
    draw();
    if(Math.abs(vel)>.05||Math.abs(target-rot)>.05){ raf=requestAnimationFrame(tick); }
    else { rot=target; draw(); raf=0; }
  }
  function go(t){ target=t; vel=0; if(reduce){rot=t;draw();return;} if(!raf) raf=requestAnimationFrame(tick); }
  function frontIndex(){ return ((Math.round(-rot/STEP)%N)+N)%N; }
  stage.addEventListener('pointerdown',function(e){
    if(e.pointerType==='mouse'&&e.button!==0) return;
    down=true; moved=false; sx=lx=e.clientX; lt=performance.now(); vel=0;
    stage.classList.add('drag');
    try{stage.setPointerCapture(e.pointerId);}catch(_){}
  });
  stage.addEventListener('pointermove',function(e){
    if(!down) return;
    var dx=e.clientX-lx, now=performance.now(), dt=Math.max(1,now-lt);
    if(Math.abs(e.clientX-sx)>6){ moved=true; hint.classList.add('gone'); }
    var k=.45; rot+=dx*k; vel=.6*vel+.4*(dx*k)*(16/dt);
    lx=e.clientX; lt=now; draw();
  });
  function up(e){
    if(!down) return; down=false; stage.classList.remove('drag');
    if(!moved && e && e.clientX!==undefined){
      /* simple clic : amene la pose touchee devant */
      var r=stage.getBoundingClientRect(), cx=e.clientX-r.left, bi=-1, bd=1e9;
      for(var i=0;i<N;i++){
        var a=(i*STEP+rot)*Math.PI/180, x=CX+Math.sin(a)*RX, dp=Math.cos(a);
        if(dp<-.2) continue; var d=Math.abs(cx-x)+(1-dp)*30; if(d<bd){bd=d;bi=i;}
      }
      if(bi>=0){ var delta=norm(bi*STEP+rot); if(delta>180)delta-=360; go(rot-delta); hint.classList.add('gone'); return; }
    }
    if(reduce){ go(nearestTarget(rot)); return; }
    target=nearestTarget(rot+vel*12); if(!raf) raf=requestAnimationFrame(tick);
  }
  stage.addEventListener('pointerup',up); stage.addEventListener('pointercancel',function(){up(null);});
  stage.addEventListener('dragstart',function(e){e.preventDefault();});
  view.addEventListener('keydown',function(e){
    if(e.key==='ArrowRight'){go(nearestTarget(rot)-STEP);hint.classList.add('gone');e.preventDefault();}
    else if(e.key==='ArrowLeft'){go(nearestTarget(rot)+STEP);hint.classList.add('gone');e.preventDefault();}
  });
  if(!reduce){
    (function loop(now){T=now; sway=Math.sin(now/1700)*1.4; PX+=(tPX-PX)*.06; draw(); requestAnimationFrame(loop);})(performance.now());
    addEventListener('pointermove',function(e){tPX=(e.clientX/innerWidth-.5)*2;},{passive:true});
    ['pointerdown','keydown','wheel'].forEach(function(ev){addEventListener(ev,function(){lastI=performance.now();},{passive:true});});
    setInterval(function(){ if(document.hidden||down) return; if(performance.now()-lastI>9000){ go(nearestTarget(rot)-STEP); } },4200);
  }
  addEventListener('resize',layout);
  layout(); nm.textContent=items[cur<0?0:cur].getAttribute('data-label');
})();
</script>

<script>
/* ===== Finitions : liens, curseur, etoiles filantes, texte tape ===== */
(function(){
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  var fine=window.matchMedia&&matchMedia('(hover:hover) and (pointer:fine)').matches;
  var COL={'YouTube':'255,56,96','Twitch':'145,70,255','Instagram':'225,48,108','Discord':'88,101,242'};
  [].slice.call(document.querySelectorAll('#links li')).forEach(function(li,i){
    var a=li.firstChild; if(!a) return;
    li.style.setProperty('--i',i);
    var nEl=a.querySelector('.lt > span:last-child > span'), name=nEl?nEl.textContent:'';
    a.style.setProperty('--b',COL[name]||'168,85,247');
    if(!reduce&&fine){
      a.addEventListener('pointermove',function(e){
        var r=a.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;
        a.style.setProperty('--ry',(x*8).toFixed(2)+'deg'); a.style.setProperty('--rx',(-y*10).toFixed(2)+'deg');
      });
      a.addEventListener('pointerleave',function(){a.style.setProperty('--rx','0deg');a.style.setProperty('--ry','0deg');});
    }
    if(!reduce){
      a.addEventListener('pointerdown',function(e){
        var r=a.getBoundingClientRect(),d=Math.max(r.width,r.height)*1.6,sp=document.createElement('span');
        sp.className='rip'; sp.style.cssText='width:'+d+'px;height:'+d+'px;left:'+(e.clientX-r.left-d/2)+'px;top:'+(e.clientY-r.top-d/2)+'px';
        a.appendChild(sp); setTimeout(function(){if(sp.parentNode)sp.parentNode.removeChild(sp);},700);
      });
    }
  });
  if(reduce) return;
  /* halo qui suit la souris */
  if(fine){
    var g=document.createElement('div'); g.id='cglow'; document.body.appendChild(g);
    var tx=innerWidth/2,ty=innerHeight/3,cx=tx,cy=ty;
    addEventListener('pointermove',function(e){tx=e.clientX;ty=e.clientY;},{passive:true});
    (function f(){cx+=(tx-cx)*.12;cy+=(ty-cy)*.12;g.style.transform='translate('+cx.toFixed(1)+'px,'+cy.toFixed(1)+'px)';requestAnimationFrame(f);})();
  }
  /* etoiles filantes */
  var fx=document.getElementById('fx');
  (function spawn(){
    setTimeout(function(){
      if(!document.hidden&&fx){
        var s=document.createElement('div'); s.className='shoot';
        s.style.left=(Math.random()*65+3)+'vw'; s.style.top=(Math.random()*38+2)+'vh';
        fx.appendChild(s); setTimeout(function(){if(s.parentNode)s.parentNode.removeChild(s);},1400);
      }
      spawn();
    },2600+Math.random()*4600);
  })();
  /* texte qui s'ecrit */
  var bio=document.querySelector('.bio');
  if(bio){
    var txt=bio.textContent; bio.setAttribute('role','text'); bio.setAttribute('aria-label',txt); bio.textContent='';
    var sp=document.createElement('span'); sp.setAttribute('aria-hidden','true');
    var cr=document.createElement('span'); cr.className='caret'; cr.setAttribute('aria-hidden','true');
    bio.appendChild(sp); bio.appendChild(cr);
    var k=0;
    setTimeout(function step(){
      if(k<=txt.length){sp.textContent=txt.slice(0,k++);setTimeout(step,26+Math.random()*30);}
      else setTimeout(function(){if(cr.parentNode)cr.parentNode.removeChild(cr);},2000);
    },1100);
  }
})();
</script>
